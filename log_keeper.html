<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그 보관함</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' rx='3' fill='%232f6df0'/><path d='M4 4h8v1.6H4zM4 7.2h8v1.6H4zM4 10.4h5v1.6H4z' fill='%23ffffff'/></svg>">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #f1f3f7;
    --panel: #ffffff;
    --border: #dde2ea;
    --text: #41454f;
    --text-strong: #1a1d24;
    --text-dim: #858a99;
    --accent: #2f6df0;
    --accent-deep: #2258cc;
    --accent-soft: #e6eefe;
    --field: #f8f9fc;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 10px 30px rgba(0,0,0,0.06);
    --ui: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
    --narration: #5a5f6e;
    --dialogue-bg: #eef3fe;
    --dialogue-text: #1f3f7a;
    --dialogue-bar: #2f6df0;
    --user-text: #6f4bd6;
    --user-narration: #9aa0ad;
    --status-bg: #f4f7fd;
    --status-head: #e9f0fd;
    --section-color: #b67d1f;
    --code-bg: #f4f5f8;
  }
  [data-theme="dark"] {
    --bg: #15161c;
    --panel: #1d1e26;
    --border: #2c2e3a;
    --text: #c5c8d2;
    --text-strong: #e7e9ef;
    --text-dim: #888c9c;
    --accent: #5b9bf0;
    --accent-deep: #7db2f5;
    --accent-soft: #1d2a44;
    --field: #191a21;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.28);
    --narration: #a3a8b6;
    --dialogue-bg: #1c2740;
    --dialogue-text: #aecbf6;
    --dialogue-bar: #5b9bf0;
    --user-text: #b9a3f0;
    --user-narration: #6e7280;
    --status-bg: #1a1c26;
    --status-head: #20283c;
    --section-color: #e0b061;
    --code-bg: #161720;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  ::selection { background: var(--accent-soft); color: var(--accent-deep); }
  /* 채팅 본문 영역의 드래그 색은 채팅방 색을 따라간다 */
  .content ::selection {
    background: var(--c-select, var(--accent-soft));
    color: var(--c-accent-deep, var(--accent-deep));
  }
  body {
    font-family: var(--ui);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.25s ease, color 0.25s ease;
  }
  button { font-family: var(--ui); }
  header {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-weight: 600; font-size: 15px;
    letter-spacing: -0.02em; color: var(--text-strong);
    cursor: pointer; user-select: none;
    border-radius: 8px; padding: 3px 6px; margin: -3px -6px;
    transition: background 0.12s;
  }
  .brand:hover { background: var(--field); }
  .brand .mark {
    width: 22px; height: 22px; border-radius: 7px;
    background: linear-gradient(135deg, #6fb0f5, #3f6fd8);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .brand small { color: var(--text-dim); font-weight: 400; font-size: 11px; }
  .header-actions { display: flex; gap: 7px; align-items: center; }
  button {
    font-size: 12px; font-weight: 500;
    color: var(--text); background: var(--field);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.13s ease;
  }
  button:hover { border-color: var(--accent); color: var(--accent-deep); }
  button:active { transform: translateY(1px); }
  button svg { width: 14px; height: 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: 0.9; color: #fff; }
  button.icon { padding: 7px; }
  button.danger:hover { border-color: #e0556b; color: #e0556b; }
  /* 케이브덕 로그 추출 — 헤더에서 눈에 띄는 강조 버튼 */
  .cd-btn {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600; font-size: 12px;
    padding: 7px 13px;
    box-shadow: 0 2px 8px rgba(47,109,240,0.28);
  }
  .cd-btn:hover { color: #fff; opacity: 0.92; border-color: var(--accent); }
  .cd-btn svg { width: 15px; height: 15px; }
  @media (max-width: 760px) {
    .cd-btn span { display: none; }
    .cd-btn { padding: 7px; }
  }
  main { display: flex; min-height: calc(100vh - 56px); }
  .sidebar {
    width: 244px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
    position: sticky; top: 56px; height: calc(100vh - 56px);
  }
  .side-top { padding: 14px 12px 8px; display: flex; flex-direction: row; gap: 7px; }
  .side-top button { justify-content: center; }
  .side-top .primary { flex: 1; }
  .side-top .icon { flex-shrink: 0; }
  .side-search {
    position: relative; padding: 4px 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  .side-search input {
    width: 100%; font-family: var(--ui); font-size: 12.5px;
    color: var(--text); background: var(--field);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px 8px 30px; outline: none;
    transition: border-color 0.13s ease;
  }
  .side-search input:focus { border-color: var(--accent); }
  .side-search svg {
    position: absolute; left: 21px; top: 13px;
    width: 14px; height: 14px; color: var(--text-dim);
  }
  /* 로그 내용 검색 바 — 처음엔 로그 맨 위, 스크롤하면 영역 상단에 붙음 */
  .log-search {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 26px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 38;
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  }
  .ls-box {
    position: relative; flex: 1; display: flex; align-items: center;
  }
  .ls-box > svg {
    position: absolute; left: 11px;
    width: 15px; height: 15px; color: var(--text-dim);
    pointer-events: none;
  }
  .ls-box input {
    width: 100%; font-family: var(--ui); font-size: 13px;
    color: var(--text); background: var(--field);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 32px 9px 33px; outline: none;
    transition: border-color 0.13s ease;
  }
  .ls-box input:focus { border-color: var(--accent); }
  .ls-clear {
    position: absolute; right: 7px; top: 50%;
    transform: translateY(-50%);
    border: 0; background: transparent; cursor: pointer;
    color: var(--text-dim); font-size: 12px; line-height: 1;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .ls-clear:hover { background: var(--border); color: var(--text-strong); }
  .ls-count {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; min-width: 44px; text-align: center;
  }
  .ls-nav { display: flex; gap: 2px; }
  .ls-navbtn {
    border: 1px solid var(--border); background: var(--field);
    color: var(--text-dim); cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: 0.12s;
  }
  .ls-navbtn svg { width: 16px; height: 16px; }
  .ls-navbtn:hover { color: var(--accent); border-color: var(--accent); }
  .ls-navbtn:disabled { opacity: 0.35; cursor: default; }
  .ls-navbtn:disabled:hover { color: var(--text-dim); border-color: var(--border); }
  .ls-close {
    border: 0; background: transparent; cursor: pointer;
    color: var(--text-dim); font-size: 15px;
    width: 26px; height: 26px; border-radius: 6px;
  }
  .ls-close:hover { background: var(--border); color: var(--text-strong); }
  /* 검색어 하이라이트 */
  mark.log-hit {
    background: #ffe169; color: #1a1a1a;
    border-radius: 3px; padding: 0 1px;
  }
  [data-theme="dark"] mark.log-hit {
    background: #d8b73a; color: #15161c;
  }
  /* 현재 보고 있는 일치 항목 — 더 진하게 */
  mark.log-hit.current {
    background: #ff9800; color: #fff;
    box-shadow: 0 0 0 2px rgba(255,152,0,0.35);
  }
  [data-theme="dark"] mark.log-hit.current {
    background: #ff9f3a; color: #15161c;
    box-shadow: 0 0 0 2px rgba(255,159,58,0.4);
  }
  .side-title {
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-dim); padding: 13px 16px 7px;
  }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 14px; }
  .chat-item {
    position: relative;
    padding: 10px 11px; border-radius: 9px; margin-bottom: 3px;
    cursor: pointer; transition: background 0.12s ease;
    border: 1px solid transparent;
  }
  .chat-item:hover { background: var(--field); }
  .chat-item.active { background: var(--c-soft, var(--accent-soft)); border-color: var(--border); }
  .chat-item.active::before {
    content: ""; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 56%; border-radius: 3px;
    background: var(--c-accent, var(--accent));
  }
  .ci-title {
    font-size: 13px; font-weight: 600; color: var(--text-strong);
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-item.active .ci-title { color: var(--c-accent-deep, var(--accent-deep)); }
  .ci-emoji { font-size: 14px; flex-shrink: 0; }
  .ci-meta {
    font-size: 11px; color: var(--text-dim);
    margin-top: 3px; display: flex; gap: 7px;
  }
  .empty-list {
    padding: 26px 16px; text-align: center;
    color: var(--text-dim); font-size: 12px; line-height: 1.8;
  }
  /* 채팅방 폴더 */
  .folder-group {
    margin-bottom: 6px; border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--field);
    overflow: hidden;
  }
  .folder-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 11px; cursor: pointer;
    font-size: 12.5px; font-weight: 700;
    user-select: none;
  }
  .folder-head:hover { background: var(--border); }
  .folder-arrow {
    font-size: 10px; transition: transform 0.15s;
    flex-shrink: 0; width: 9px; text-align: center;
    color: var(--text-dim);
  }
  .folder-group.collapsed .folder-arrow { transform: rotate(-90deg); }
  .folder-group.collapsed .folder-body { display: none; }
  .folder-ic {
    width: 17px; height: 17px; flex-shrink: 0;
    color: var(--fc, #9aa3b2);
  }
  .folder-name {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text-strong);
  }
  .folder-count {
    font-size: 11px; color: #fff; font-weight: 700;
    background: var(--fc, #9aa3b2); border-radius: 9px;
    padding: 1px 8px; min-width: 20px; text-align: center;
    flex-shrink: 0;
  }
  /* 폴더 설정 버튼 — 이름 옆에 항상 보이는 점 세 개 */
  .folder-menu {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); padding: 3px 2px;
    border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.4; transition: background 0.12s, opacity 0.12s;
  }
  .folder-menu svg { width: 15px; height: 15px; pointer-events: none; }
  .folder-menu:hover { background: var(--border); opacity: 1; }
  /* 펼친 폴더 본문 — 안쪽임이 보이게 들여쓰기 + 배경 구분 */
  .folder-body {
    padding: 4px 7px 6px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .folder-body .chat-item { margin-bottom: 2px; }
  .folder-group.drop-into { outline: 2px dashed var(--accent); outline-offset: -1px; }
  .nofolder-zone.drop-into {
    outline: 2px dashed var(--accent); outline-offset: -2px;
    border-radius: 8px;
  }
  /* 폴더 밖 채팅 영역 — 폴더 본문 스타일은 빼고, 위에 여백을 둔다 */
  .nofolder-zone {
    padding: 0; background: none; border-top: none;
  }
  .nofolder-zone.has-gap { margin-top: 12px; }
  /* 채팅 항목 — 수정 버튼 */
  .chat-item { display: flex; align-items: center; gap: 4px; }
  .ci-main { flex: 1; min-width: 0; }
  .ci-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-edit {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 12px; padding: 3px 5px;
    border-radius: 6px; opacity: 0; transition: opacity 0.12s; flex-shrink: 0;
  }
  .chat-item:hover .ci-edit { opacity: 1; }
  .ci-edit:hover { background: var(--border); color: var(--text-strong); }
  /* 드래그 중 */
  .chat-item.dragging, .folder-group.dragging { opacity: 0.4; }
  .chat-item.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
  .folder-group.drag-over > .folder-head { box-shadow: inset 0 2px 0 var(--accent); }
  /* 폴더 색 팔레트 (모달) */
  .fc-palette { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fc-swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
    transition: transform 0.1s;
  }
  .fc-swatch:hover { transform: scale(1.15); }
  .fc-swatch.sel { border-color: var(--text-strong); }
  /* 사용자 지정 색 버튼 — 무지개 원 */
  .fc-custom {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer;
    position: relative; overflow: hidden; transition: transform 0.1s;
    background:
      conic-gradient(
        hsl(0,90%,60%), hsl(40,90%,58%), hsl(75,80%,52%),
        hsl(140,70%,50%), hsl(180,75%,52%), hsl(210,90%,60%),
        hsl(260,80%,62%), hsl(300,80%,62%), hsl(330,85%,62%),
        hsl(360,90%,60%));
  }
  .fc-custom:hover { transform: scale(1.12); }
  .fc-custom.sel { border-color: var(--text-strong); }
  /* color input은 원 전체를 덮되 완전히 안 보이게 */
  .fc-custom input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; border: none; padding: 0; margin: 0;
    appearance: none; -webkit-appearance: none;
  }
  .fc-custom input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .fc-custom input[type="color"]::-webkit-color-swatch { border: none; }
  .fc-custom input[type="color"]::-moz-color-swatch { border: none; }
  /* 고른 색 미리보기 — 무지개 위에 동그란 점으로 */
  .fc-custom.picked::after {
    content: ""; position: absolute;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--picked, #2f6df0);
    border: 2.5px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    pointer-events: none;
  }
  /* 폴더 선택 칩 (채팅 정보 수정 모달) */
  .folder-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .folder-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--field);
    color: var(--text); font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all 0.12s;
  }
  .folder-chip:hover { border-color: var(--fc, var(--accent)); }
  .folder-chip.sel {
    background: var(--fc, var(--accent)); color: #fff;
    border-color: var(--fc, var(--accent));
  }
  .fchip-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--fc, #9aa3b2); flex-shrink: 0;
  }
  .folder-chip.sel .fchip-dot { background: #fff; }
  .fchip-ic { font-size: 12px; }
  .side-foot {
    padding: 10px 14px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--text-dim); text-align: center;
  }
  .content { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .content-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 26px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .ch-title {
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 700;
    color: var(--text-strong); letter-spacing: -0.02em;
  }
  .ch-title .ct-edit {
    cursor: text; border-radius: 6px;
    padding: 2px 6px; margin: -2px -6px;
    transition: background 0.12s;
  }
  .ch-title .ct-edit:hover { background: var(--field); }
  .ch-sub {
    font-size: 11.5px; font-weight: 400;
    color: var(--text-dim); margin-top: 3px;
  }
  .ch-placeholder { color: var(--text-dim); font-weight: 500; font-size: 14px; }
  .scroll-area { flex: 1; min-height: 0; overflow-y: auto; position: relative; scroll-behavior: smooth; }
  .scroll-inner { max-width: 780px; margin: 0 auto; padding: 26px 26px 24px; box-sizing: border-box; }
  /* 턴이 있을 때 — 입력창이 로그 바로 뒤에 붙고 빈 공간을 차지하지 않음 */
  /* 턴이 없을 때(welcome) — 영역을 꽉 채워서 입력창이 화면 안에 들어오게 */
  body:not(.has-turns) .scroll-inner { min-height: 100%; display: flex; flex-direction: column; }
  body:not(.has-turns) .scroll-inner .welcome { flex: 1; }
  /* 맨 위로 / 맨 아래로 — 화면 우하단 고정 */
  .nav-fab {
    position: fixed;
    right: 24px; bottom: 24px;
    z-index: 50;
    display: flex; flex-direction: column; gap: 10px;
  }
  .fab-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel); color: var(--text-dim);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12), 0 6px 20px rgba(0,0,0,0.14);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: 0.14s;
  }
  .fab-btn:hover {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .fab-btn:active { transform: scale(0.92); }
  .welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 30px;
    color: var(--text-dim);
    box-sizing: border-box;
  }
  .welcome .big {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin-bottom: 16px;
  }
  .welcome h2 {
    font-size: 18px; color: var(--text-strong);
    margin-bottom: 8px; font-weight: 700;
  }
  .welcome p { font-size: 13px; max-width: 400px; line-height: 1.9; }
  .welcome .hint {
    margin-top: 20px; font-size: 11.5px;
    background: var(--field); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; max-width: 430px;
    line-height: 1.8;
  }
  .turn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 16px;
    box-shadow: var(--shadow); overflow: hidden;
    animation: rise 0.34s ease backwards;
  }

<script>
"use strict";
const STORE_KEY = "logKeeper.v1";
const THEME_KEY = "logKeeper.theme";
const $ = id => document.getElementById(id);
const $$ = s => [...document.querySelectorAll(s)];
let state = { chats: [] };
let activeId = null;
let composerMode = "turn";
let sortMode = "input"; // input | turnAsc | turnDesc
let logQuery = ""; // 로그 내용 검색어 (빈 문자열이면 검색 안 함)
let logHitIdx = -1; // 현재 보고 있는 일치 항목 인덱스

// ===== IndexedDB 저장소 =====
// localStorage는 약 5MB 한계라 로그가 쌓이면 저장이 통째로 실패한다.
// IndexedDB는 용량이 훨씬 커서 대용량 로그도 안전하게 저장된다.
const IDB_NAME = "logKeeperDB";
const IDB_STORE = "appState";
const IDB_KEY = "state";
let _idb = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE))
        db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(key) {
  return new Promise((resolve, reject) => {
    const tx = _idb.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbSet(key, val) {
  return new Promise((resolve, reject) => {
    const tx = _idb.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function load() {
  try {
    _idb = await openIDB();
    let data = await idbGet(IDB_KEY);
    // IndexedDB에 없으면 — 예전 localStorage 데이터를 옮겨온다 (1회 마이그레이션)
    if (!data) {
      try {
        const old = localStorage.getItem(STORE_KEY);
        if (old) {
          data = JSON.parse(old);
          await idbSet(IDB_KEY, data);
          localStorage.removeItem(STORE_KEY); // 옮겼으니 정리
        }
      } catch (e) { console.warn("migration failed", e); }
    }
    if (data) state = data;
  } catch (e) {
    console.warn("IndexedDB load failed, falling back to localStorage", e);
    // IndexedDB를 못 쓰는 환경 — localStorage로 폴백
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e2) {}

  const result = [];
  for (const b of blocks) {
    const txt = statusText(b);
    if (txt && txt.length > 12) {
      const dup = seenTexts.some(prev =>
        prev === txt || prev.includes(txt) || txt.includes(prev)
      );
      if (dup) continue;
      seenTexts.push(txt);
    }
    result.push(b);
  }
  return result;
}
// [[HTML]] 블록이 사실은 "평범한 <details> 상태창"인지 판별.
// 디자인 카드(그라데이션·그림자·중첩 details 등)는 평문으로 바꾸지 말고
// HTML 원본 그대로 렌더해야 하므로 null 을 반환한다.
// 정말 꾸밈 없는 맨 <details> 상태창만 그 HTML 배열로 반환.
function extractPlainStatusDetails(html) {
  if (!/<details[\s\S]*?<\/details>/i.test(html)) return null;
  // 크리에이터 UI / 디자인 카드 흔적 — 하나라도 있으면 HTML 그대로 렌더
  const creatorSign = /background\s*:\s*#0|letter-spacing\s*:\s*normal|ui-monospace|monospace|gradient|box-shadow|position\s*:\s*absolute/i;
  // 중첩 <details>(접이식 섹션을 가진 디자인 카드)면 HTML 그대로 렌더
  try {
    const tpl = document.createElement("template");
    tpl.innerHTML = html || "";
    const ds = tpl.content.querySelectorAll("details");
    for (const d of ds) if (d.querySelector("details")) return null;
  } catch (e) { /* 파싱 실패 시 아래 정규식 검사로 진행 */ }
  // <details> 바깥(껍데기)에 디자인 흔적이 있으면 일반 상태창이 아님
  const shell = html.replace(/<details[\s\S]*?<\/details>/gi, "");
  if (creatorSign.test(shell)) return null;
  // <details> 들을 모두 모은다
  const list = [];
  const re = /<details[\s\S]*?<\/details>/gi;
  let m;
  while ((m = re.exec(html)) !== null) {
    // 각 details 자체에 디자인 흔적이 짙으면 일반 상태창 아님
    if (creatorSign.test(m[0])) return null;
    list.push(m[0]);
  }
  return list.length ? list : null;
}
// 텍스트에서 [유저] 표식을 찾아 user 블록과 prose 블록으로 나눈다
function splitUserProse(body, blocks) {
  const lines = body.split("\n");
  let buf = [];
  let mode = "prose"; // prose | user
  const flush = () => {
    const t = buf.join("\n").trim();
    if (t) blocks.push({ kind: mode === "user" ? "user" : "prose", text: t });
    buf = [];
  };
  for (const line of lines) {
    if (/^\[유저\]\s*$/.test(line.trim())) {
      flush();
      mode = "user";
      continue;
    }
    if (/^\[(캐릭터|character|ai|봇)\]\s*$/i.test(line.trim())) {
      flush();
      mode = "prose";
      continue;
    }
    // 대괄호 묶음 상태창 줄 — 별도 status 블록으로 떼어낸다
    if (isBracketStatusLine(line)) {
      flush();
      blocks.push({ kind: "status", data: parseBracketStatus(line) });
      continue;
    }
    // 상태창이 아닌데 ][ 로 붙은 대괄호 묶음 (예: 한 줄로 들어온 카톡 메시지)
    // — 각 [ ] 사이를 줄바꿈으로 되돌려 본래 모양대로 보여준다
    if (/\]\s*\[/.test(line) && /^\s*\[/.test(line) && /\]\s*$/.test(line.trim())) {
      const groups = splitTopBrackets(line.trim());
      let rest = line.trim();
      for (const g of groups) rest = rest.replace(g, "");
      if (groups.length >= 2 && rest.trim().length <= 3) {
        for (const g of groups) buf.push(g);
        continue;
      }
    }
    buf.push(line);
  }
  flush();
}
// 줄에서 최상위 [ ... ] 묶음들만 분리 (안쪽 중첩 대괄호는 묶음 안에 포함)
function splitTopBrackets(t) {
  const groups = [];
  let depth = 0, start = -1;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c === "[") {
      if (depth === 0) start = i;
      depth++;
    } else if (c === "]") {
      depth--;
      if (depth === 0 && start >= 0) { groups.push(t.slice(start, i + 1)); start = -1; }
      if (depth < 0) depth = 0;
    }
  }
  return groups;
}
// 한 줄이 [ ... ][ ... ][ ... ] 형태의 대괄호 묶음 상태창인지 판별.
// 케이브덕에서 접히지 않는(일반 텍스트) 상태창이 이렇게 나온다.
// 상태창 특유의 키워드 — 이게 들어있어야 진짜 상태창으로 본다.
// (카톡/문자 메시지를 표현한 대괄호와 구분하기 위함)
const STATUS_KEYWORDS = [
  "호감도", "관계", "다음 일정", "다음일정", "일정", "턴", "NPC", "PC의",
  "AI 한마디", "AI한마디", "상황", "복장", "장소", "공간", "시각", "시간",
  "속마음", "가이드", "폭주", "수치", "약속", "능력", "스탯", "상태"
];
function hasStatusKeyword(t) {
  return STATUS_KEYWORDS.some(k => t.includes(k));
}
function isBracketStatusLine(line) {
  const t = line.trim();
  if (!/^\[/.test(t) || !/\]\s*$/.test(t)) return false;
  const groups = splitTopBrackets(t);
  if (groups.length < 2) return false;
  // 묶음들을 다 빼고 남는 게 거의 없어야 함 (= 줄 전체가 대괄호)
  let rest = t;
  for (const g of groups) rest = rest.replace(g, "");
  if (rest.trim().length > 3) return false;
  // 상태창 키워드가 있어야 진짜 상태창 — 없으면 문자 메시지 등으로 보고 대사 처리
  return hasStatusKeyword(t);
}
// 대괄호 묶음 줄을 상태창 데이터({summary, items})로 변환
function parseBracketStatus(line) {
  const groups = splitTopBrackets(line.trim());
  const items = [];
  for (const g of groups) {
    const inner = g.slice(1, -1).trim();
    if (!inner) continue;
    // "키: 값" 형태면 kv 로, 아니면 통째로 raw 로
    // 단, 키 부분에 / 가 있으면 (정보 나열이므로) 분리하지 않는다
    const colonIdx = inner.indexOf(":");
    if (colonIdx > 0 && colonIdx < 30) {
      const key = inner.slice(0, colonIdx).trim();
      const val = inner.slice(colonIdx + 1).trim();
      if (key && val && !key.includes("/")) { items.push({ type: "kv", key, val }); continue; }
    }
    items.push({ type: "raw", text: inner });
  }
  return { summary: "상태창", items };
}
// ``` 코드펜스 마커 제거 — 펜스 안 내용은 살리고 ``` 줄만 없앤다
function stripCodeFences(s) {
  return s.replace(/^[ \t]*```[^\n]*\n?/gm, "").replace(/```/g, "");
}
// 로그 텍스트에서 턴 번호 추출 (예: "442턴", "[ 442턴 / ... ]")
function extractTurnNo(raw) {
  const m = raw.match(/(\d+)\s*턴/);
  return m ? parseInt(m[1], 10) : null;
}
function parseDetails(html) {
  let summary = "상태창";
  const sm = html.match(/<summary[^>]*>([\s\S]*?)<\/summary>/i);
  if (sm) summary = stripTags(sm[1]).trim() || "상태창";
  let inner = html
    .replace(/<summary[^>]*>[\s\S]*?<\/summary>/i, "")
    .replace(/<\/?details[^>]*>/gi, "");
  inner = stripTags(inner);
  const lines = inner.split("\n").map(l => l.trimEnd());
  const items = [];
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    const listM = t.match(/^(?:[-*\u2022]|\d+[.)])\s+(.*)$/);
    if (listM) { items.push({ type: "li", text: listM[1].trim() }); continue; }
    // 파이프(|) 기준 분리 — 상태창의 유일한 구분자 (콜론은 값 안에 그대로 둔다)
    const pipeIdx = t.indexOf("|");
    if (pipeIdx > 0 && pipeIdx < 80) {
      const key = t.slice(0, pipeIdx).trim();
      const val = t.slice(pipeIdx + 1).trim();
      if (key && val) { items.push({ type: "kv", key, val }); continue; }
    }
    if (t.length <= 36 && (/^[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2190-\u21FF\u2B00-\u2BFF]/u.test(t) || /^\[.*\]$/.test(t))) {
      items.push({ type: "section", text: t });
      continue;
    }
    items.push({ type: "raw", text: t });
  }
  return { summary, items };
}
function stripTags(s) {
  return s
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li|tr)>/gi, "\n")
    .replace(/<li[^>]*>/gi, "- ")
    .replace(/<[^>]+>/g, "")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&amp;/g, "&").replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'").replace(/&nbsp;/g, " ");
}
function renderProse(text, isUser) {
  const paras = text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
  let html = "";
  const isMsgLine = l => /^\[[\s\S]*\]$/.test(l.trim());
  for (const para of paras) {
    const lines = para.split(/\n/).map(l => l.trim()).filter(Boolean);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const next = lines[i + 1];
      // 이 줄이 대괄호 메시지이고 다음 줄도 대괄호 메시지면 — 사이 여백을 좁힌다
      const tight = isMsgLine(line) && next && isMsgLine(next);
      html += '<p' + (tight ? ' class="msg-tight"' : '') + '>' + inlineFormat(line, isUser) + "</p>";
    }
  }
  return html || "<p>" + inlineFormat(text.trim(), isUser) + "</p>";
}
// 한 줄을 *서술* 조각과 대사 조각으로 쪼개 렌더링
// 규칙: *...* 안은 서술, 그 바깥은 전부 대사 ("" 유무 무관)
function inlineFormat(line, isUser) {
  const raw = line;
  let out = "";
  let i = 0;
  while (i < raw.length) {
    if (raw[i] === "*") {
      // 닫는 * 찾기
      const close = raw.indexOf("*", i + 1);
      if (close !== -1) {
        const inner = raw.slice(i + 1, close);
        out += '<span class="narration">' + escapeHtml(inner) + '</span>';
        i = close + 1;
        continue;
      }
      // 닫는 *가 없는 별표 — 그대로 출력하고 한 칸 넘어간다 (무한루프 방지)
      out += escapeHtml("*");
      i++;
      continue;
    }
    // 다음 * 까지가 대사 조각
    let next = raw.indexOf("*", i);
    if (next === -1) next = raw.length;
    const seg = raw.slice(i, next);
    if (seg.trim()) {
      // 유저 대사는 .user-block .dialogue CSS가 색을 맡으므로 인라인 색 생략
      out += '<span class="dialogue"' + (isUser ? "" : dialogueColor()) + '>' + escapeHtml(seg) + '</span>';
    } else {
      out += escapeHtml(seg); // 공백만 있으면 그대로
    }
    i = next;
  }
  return out || escapeHtml(raw);
}
// 현재 채팅에 지정된 대사 색이 있으면 인라인 스타일로 반환
function dialogueColor() {
  const chat = getActive();
  if (chat && chat.dialogueColor)
    return ' style="color:' + chat.dialogueColor + '"';
  return "";
}
// 유저 블록에 유저 대사색/서술색 CSS 변수를 인라인으로 주입
function userColorStyle(chat) {
  let s = "";
  if (chat && chat.userDiaColor) s += "--c-userdia:" + chat.userDiaColor + ";";
  if (chat && chat.userNarColor) s += "--c-usernar:" + chat.userNarColor + ";";
  return s ? ' style="' + s + '"' : "";
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// 크리에이터 HTML 상태창을 안전하게 정화 — script/이벤트핸들러/위험태그 제거 후 그대로 렌더
function sanitizeHtml(html) {
  try {
    const tpl = document.createElement("template");
    tpl.innerHTML = html || "";
    const BAD_TAGS = ["script", "iframe", "object", "embed", "link", "meta", "base", "form", "input", "textarea", "button", "style"];
    tpl.content.querySelectorAll(BAD_TAGS.join(",")).forEach(el => el.remove());
    const allEls = tpl.content.querySelectorAll("*");
    // 모든 요소의 위험 속성 제거 (on*, javascript: 등)
    allEls.forEach(el => {
      [...el.attributes].forEach(attr => {
        const name = attr.name.toLowerCase();
        const val = (attr.value || "").toLowerCase();
        if (name.startsWith("on")) el.removeAttribute(attr.name);
        else if ((name === "src" || name === "href") && val.includes("javascript:"))
          el.removeAttribute(attr.name);
        else if (name === "style" && val.includes("javascript:"))
          el.removeAttribute(attr.name);
      });
    });
// summary가 떠 있어(absolute/fixed) 접으면 안 보이는 상태창 — summary를 제자리로 돌려 접혀도 보이게
    tpl.content.querySelectorAll("details > summary").forEach(sm => {
      const st = sm.getAttribute("style") || "";
      if (/position\s*:\s*(absolute|fixed)/i.test(st))
        sm.setAttribute("style", st.replace(/position\s*:\s*(absolute|fixed)/ig, "position:static"));
    });
    return tpl.innerHTML;
  } catch (e) {
    // 깨진 HTML 등으로 처리 실패 — 태그를 다 벗겨 텍스트만 안전하게 반환
    console.warn("sanitizeHtml failed", e);
    return escapeHtml((html || "").replace(/<[^>]*>/g, " ").slice(0, 4000));
  }
}

function getActive() { return state.chats.find(c => c.id === activeId); }

// 렌더된 영역에서 검색어와 일치하는 텍스트를 <mark>로 강조. 일치 개수를 반환.
function highlightHits(root, query) {
  if (!query) return 0;
  const q = query.toLowerCase();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.toLowerCase().includes(q)) return NodeFilter.FILTER_REJECT;
      const p = node.parentNode;
      if (p && (p.nodeName === "SCRIPT" || p.nodeName === "STYLE" || p.nodeName === "MARK"))
        return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets = [];
  let n;
  while ((n = walker.nextNode())) targets.push(n);
  let count = 0;
  for (const node of targets) {
    const text = node.nodeValue;
    const low = text.toLowerCase();
    const frag = document.createDocumentFragment();
    let idx = 0, hit;
    while ((hit = low.indexOf(q, idx)) !== -1) {
      if (hit > idx) frag.appendChild(document.createTextNode(text.slice(idx, hit)));
      const mark = document.createElement("mark");
      mark.className = "log-hit";
      mark.dataset.hitIdx = count;
      mark.textContent = text.slice(hit, hit + q.length);
      frag.appendChild(mark);
      idx = hit + q.length;
      count++;
    }
    if (idx < text.length) frag.appendChild(document.createTextNode(text.slice(idx)));
    node.parentNode.replaceChild(frag, node);
  }
  return count;
}
// 검색 UI(카운트, 화살표 활성화) 갱신
function updateLogSearchUI(hitCount) {
  const cntEl = $("logSearchCount");
  const prev = $("logSearchPrev"), next = $("logSearchNext");
  if (!logQuery) {
    if (cntEl) cntEl.textContent = "";
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
    logHitIdx = -1;

  }
  if (hitCount === 0) {
    if (cntEl) cntEl.textContent = "0개";
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
    logHitIdx = -1;
    return;
  }
  // 인덱스 범위 보정
  if (logHitIdx < 0) logHitIdx = 0;
  if (logHitIdx >= hitCount) logHitIdx = hitCount - 1;
  if (cntEl) cntEl.textContent = (logHitIdx + 1) + " / " + hitCount;
  if (prev) prev.disabled = false;
  if (next) next.disabled = false;
  markCurrentHit();
}
// 현재 인덱스의 일치 항목을 강조하고 화면에 보이게 스크롤
function markCurrentHit(doScroll) {
  const marks = $("scrollInner").querySelectorAll("mark.log-hit");
  marks.forEach(m => m.classList.remove("current"));
  if (logHitIdx < 0 || logHitIdx >= marks.length) return;
  const cur = marks[logHitIdx];
  cur.classList.add("current");
  if (doScroll !== false)
    cur.scrollIntoView({ behavior: "smooth", block: "center" });
}
// 다음/이전 일치 항목으로 이동
function moveLogHit(dir) {
  const marks = $("scrollInner").querySelectorAll("mark.log-hit");
  if (!marks.length) return;
  logHitIdx = (logHitIdx + dir + marks.length) % marks.length;
  const cntEl = $("logSearchCount");
  if (cntEl) cntEl.textContent = (logHitIdx + 1) + " / " + marks.length;
  markCurrentHit();
}

// ===== 사이드바 드래그 앤 드롭 =====
// 채팅을 끌어서 순서를 바꾸거나 폴더 안/밖으로 옮긴다. 폴더끼리도 순서 변경.
let _dragKind = null;   // "chat" | "folder"
let _dragId = null;
function bindDragDrop() {
  $$(".chat-item").forEach(el => {
    el.addEventListener("dragstart", e => {
      _dragKind = "chat"; _dragId = el.dataset.id;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.stopPropagation();
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      $$(".drag-over, .drop-into").forEach(x => x.classList.remove("drag-over", "drop-into"));
      _dragKind = null; _dragId = null;
    });
    el.addEventListener("dragover", e => {
      if (_dragKind !== "chat") return;
      e.preventDefault();
      el.classList.add("drag-over");
    });
    el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
    el.addEventListener("drop", e => {
      if (_dragKind !== "chat") return;
      e.preventDefault(); e.stopPropagation();
      el.classList.remove("drag-over");
      dropChatBefore(_dragId, el.dataset.id);
    });
  });
  // 폴더 본문 / 폴더 없음 영역 — 채팅을 그 폴더로 옮김
  $$(".folder-body, .nofolder-zone").forEach(zone => {
    zone.addEventListener("dragover", e => {
      if (_dragKind !== "chat") return;
      e.preventDefault();
      const g = zone.closest(".folder-group");
      (g || zone).classList.add("drop-into");
    });
    zone.addEventListener("dragleave", () => {
      const g = zone.closest(".folder-group");
      (g || zone).classList.remove("drop-into");
    });
    zone.addEventListener("drop", e => {
      if (_dragKind !== "chat") return;
      e.preventDefault();
      const g = zone.closest(".folder-group");
      (g || zone).classList.remove("drop-into");
      // 빈 영역에 떨어뜨림 → 그 폴더로 이동 (드롭이 chat-item에서 처리 안 됐을 때만)
      if (e.target.closest(".chat-item")) return;
      moveChatToFolder(_dragId, zone.dataset.fid || null);
    });
  });
  // 폴더끼리 순서 변경
  $$(".folder-group").forEach(g => {
    g.addEventListener("dragstart", e => {
      if (e.target.closest(".chat-item")) return; // 채팅 드래그는 따로
      _dragKind = "folder"; _dragId = g.dataset.fid;
      g.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.stopPropagation();
    });
    g.addEventListener("dragend", () => {
      g.classList.remove("dragging");
      $$(".drag-over, .drop-into").forEach(x => x.classList.remove("drag-over", "drop-into"));
      _dragKind = null; _dragId = null;
    });
    g.addEventListener("dragover", e => {
      if (_dragKind !== "folder") return;
      e.preventDefault();
      g.classList.add("drag-over");
    });
    g.addEventListener("dragleave", () => g.classList.remove("drag-over"));
    g.addEventListener("drop", e => {
      if (_dragKind !== "folder") return;
      e.preventDefault(); e.stopPropagation();
      g.classList.remove("drag-over");
      dropFolderBefore(_dragId, g.dataset.fid);
    });
  });
}
// 모든 채팅에 현재 화면 순서대로 order 부여
function reorderChats(orderedIds) {
  orderedIds.forEach((id, i) => {
    const c = state.chats.find(x => x.id === id);
    if (c) c.order = i;
  });
}
// dragId 채팅을 targetId 채팅 앞으로 이동 (같은 폴더로 따라감)
function dropChatBefore(dragId, targetId) {
  if (dragId === targetId) return;
  const drag = state.chats.find(c => c.id === dragId);
  const target = state.chats.find(c => c.id === targetId);
  if (!drag || !target) return;
  drag.folderId = target.folderId || null; // 대상과 같은 폴더로
  // 현재 정렬 순서를 가져와 재배치
  const sorted = [...state.chats].sort((a, b) => {
    const ao = a.order, bo = b.order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return b.updatedAt - a.updatedAt;
  });
  const ids = sorted.map(c => c.id).filter(id => id !== dragId);
  const ti = ids.indexOf(targetId);
  ids.splice(ti, 0, dragId);
  reorderChats(ids);
  save(); renderSidebar();
}
// 채팅을 특정 폴더로 이동 (순서는 끝으로)
function moveChatToFolder(dragId, folderId) {
  const drag = state.chats.find(c => c.id === dragId);
  if (!drag) return;
  if ((drag.folderId || null) === (folderId || null)) { renderSidebar(); return; }
  drag.folderId = folderId || null;
  save(); renderSidebar();
  toast(folderId ? "폴더로 옮겼어요" : "폴더에서 뺐어요");
}
// 폴더 순서 변경
function dropFolderBefore(dragId, targetId) {
  if (dragId === targetId) return;
  const sorted = [...state.folders].sort((a, b) => {
    const ao = a.order, bo = b.order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    return 0;
  });
  const ids = sorted.map(f => f.id).filter(id => id !== dragId);
  const ti = ids.indexOf(targetId);
  ids.splice(ti, 0, dragId);
  ids.forEach((id, i) => {
    const f = state.folders.find(x => x.id === id);
    if (f) f.order = i;
  });
  save(); renderSidebar();
}

  const CHUNK = 60;
  if (turns.length > CHUNK) {
    inner.innerHTML = turns.slice(0, CHUNK).map((t, i) => renderTurn(t, i)).join("");
    bindTurnEvents(chat);
    let drawn = CHUNK;
    const drawMore = () => {
      if (drawn >= turns.length || getActive() !== chat) return;
      const next = turns.slice(drawn, drawn + CHUNK);
      inner.insertAdjacentHTML("beforeend",
        next.map((t, i) => renderTurn(t, drawn + i)).join(""));
      drawn += next.length;
      bindTurnEvents(chat);
      if (drawn < turns.length) requestAnimationFrame(drawMore);
      else if (logQuery) { highlightHits(inner, logQuery); }
    };
    requestAnimationFrame(drawMore);
  } else {
    inner.innerHTML = turns.map((turn, i) => renderTurn(turn, i)).join("");
    bindTurnEvents(chat);
  }
  if ($("navFab")) $("navFab").style.display = "flex";
  // 로그 내용 검색 — 일치하는 글자를 하이라이트
  if (logQuery && turns.length <= CHUNK) {
    const hitCount = highlightHits(inner, logQuery);
    updateLogSearchUI(hitCount);
  } else if (!logQuery) {
    updateLogSearchUI(0);
  }

// 턴 카드의 복사/수정/삭제 버튼에 이벤트를 건다 (이미 건 턴은 건너뜀)

// 턴의 "실제 번호" — 지정된 turnNo가 있으면 그 값,
// 없지만 입력순 첫 턴(도입부)이면 0, 그 외엔 null(번호 없음)
function effectiveTurnNo(chat, turn) {
  if (turn.turnNo != null) return turn.turnNo;
  if (chat && chat.turns.indexOf(turn) === 0) return 0;
  return null;
}

// 정렬 모드에 따라 턴 배열 반환 (원본은 건드리지 않음)
function sortedTurns(chat) {
  const arr = chat.turns.slice();
  if (sortMode === "input") return arr;
  // 턴 번호 기준 — 번호 없는 턴은 맨 뒤로 (도입부는 0으로 취급)
  const key = t => {
    const n = effectiveTurnNo(chat, t);
    return n != null ? n : Infinity;
  };
  arr.sort((a, b) => {
    const ka = key(a), kb = key(b);
    if (ka === kb) return chat.turns.indexOf(a) - chat.turns.indexOf(b);
    return sortMode === "turnAsc" ? ka - kb : kb - ka;
  });
  return arr;
}

function renderTurn(turn, idx) {
  const chat = getActive();
  let bodyHtml = "";
  try {
    const blocks = parseLog(turn.raw);
    for (const b of blocks) {
      try {
        if (b.kind === "prose") bodyHtml += '<div class="prose">' + renderProse(b.text) + "</div>";
        else if (b.kind === "user") bodyHtml += '<div class="prose user-block"' + userColorStyle(chat) + '>' + renderProse(b.text, true) + "</div>";
        else if (b.kind === "code") bodyHtml += '<div class="codeblock">' + escapeHtml(b.text.trim()) + "</div>";
        else if (b.kind === "status") bodyHtml += renderStatus(b.data);
        else if (b.kind === "htmlstatus") bodyHtml += '<div class="html-status">' + sanitizeHtml(b.html) + "</div>";
        else if (b.kind === "jsx") bodyHtml += '<div class="jsx-slot" data-jsx="' + encodeURIComponent(b.src) + '"><div class="jsx-loading">\uD83E\uDED6 상태창 불러오는 중…</div></div>';
      } catch (e) {
        // 블록 하나가 실패해도 — 원본 텍스트라도 보여준다
        console.warn("block render failed", e);
        bodyHtml += '<div class="prose"><p>' + escapeHtml((b.text || b.html || "").slice(0, 2000)) + "</p></div>";
      }
    }
  } catch (e) {
    // 파싱 자체가 실패하면 — 원본 전체를 그대로 보여준다
    console.warn("parseLog failed", e);
    bodyHtml = '<div class="prose"><p>' + escapeHtml(turn.raw || "") + "</p></div>";
  }
  // 라벨: 실제 번호(도입부=0 포함)가 있으면 TURN n, 없으면 입력순번
  const origIdx = chat ? chat.turns.indexOf(turn) : idx;
  const effNo = chat ? effectiveTurnNo(chat, turn) : (turn.turnNo != null ? turn.turnNo : null);
  let label;
  if (effNo != null) label = "TURN " + effNo;
  else label = "#" + (origIdx + 1);
  return '<div class="turn" data-tid="' + turn.id + '" style="animation-delay:' + (Math.min(idx, 8) * 0.04) + 's">' +
    '<div class="turn-head">' +
      '<button class="turn-num turn-num-edit" title="턴 번호 수정">' + label + '</button>' +
      '<span class="spacer"></span>' +
      '<button class="turn-tool tt-copy" title="복사">\u29C9</button>' +
      '<button class="turn-tool tt-edit" title="수정">\u270E</button>' +
      '<button class="turn-tool tt-del del" title="삭제">\uD83D\uDDD1</button>' +
    '</div>' +
    '<div class="turn-body">' + (bodyHtml || '<div class="prose"><p style="color:var(--text-dim)">(빈 턴)</p></div>') + '</div>' +
    '</div>';
}
// 저장된 형광펜을 turn-body 안 텍스트에 입힌다.
// 위치가 아니라 텍스트 내용으로 저장하므로, 다시 그려도 유지된다.
function applyHighlights(turnEl, turn) {
  if (!turn.highlights || !turn.highlights.length) return;
  const body = turnEl.querySelector(".turn-body");
  if (!body) return;
  for (const hl of turn.highlights) {
    if (!hl || !hl.text) continue;
    highlightTextIn(body, hl.text, hl.color || "yellow");
  }
}
// 주어진 요소 안에서 text와 일치하는 부분을 찾아 <mark>로 감싼다
function highlightTextIn(root, text, color) {
  const needle = text.trim();
  if (!needle) return;
  // 텍스트 노드를 순회하며 일치 지점을 찾는다 (이미 mark 안인 건 건너뜀)
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement && n.parentElement.closest("mark.hl"))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const targets = [];
  let node;
  while ((node = walker.nextNode())) {
    let idx = node.nodeValue.indexOf(needle);
    if (idx !== -1) targets.push({ node, idx });
  }
  for (const t of targets) {
    try {
      const range = document.createRange();
      range.setStart(t.node, t.idx);
      range.setEnd(t.node, t.idx + needle.length);
      const mark = document.createElement("mark");
      mark.className = "hl hl-" + color;
      range.surroundContents(mark);
    } catch (e) { /* 노드 경계를 넘는 경우 등 — 건너뜀 */ }
  }
}

function renderStatus(data) {
  let body = "";
  let liBuffer = [];
  let firstSection = true;
  const flushLi = () => {
    if (liBuffer.length) {
      body += '<ul class="stat-list">' + liBuffer.join("") + "</ul>";
      liBuffer = [];
    }
  };
  for (const it of data.items) {
    if (it.type === "li") {
      liBuffer.push("<li>" + escapeHtml(it.text) + "</li>");
      continue;
    }
    flushLi();
    if (it.type === "section") {
      body += '<div class="stat-section' + (firstSection ? " first" : "") + '">' +
              escapeHtml(it.text) + "</div>";
      firstSection = false;
    } else if (it.type === "kv") {
      body += '<div class="stat-line"><span class="stat-key">' + escapeHtml(it.key) +
              '</span><span class="stat-val">' + escapeHtml(it.val) + "</span></div>";
    } else {
      body += '<div class="stat-raw">' + escapeHtml(it.text) + "</div>";
    }
  }
  flushLi();
  return '<details class="status-card">' +
    '<summary>\uD83E\uDEAA ' + escapeHtml(data.summary) + '<span class="chev">\u25BE</span></summary>' +
    '<div class="status-body">' + body + '</div>' +
    '</details>';
}

// 색 선택 UI에 이벤트를 걸고, 현재 고른 색을 읽는 getter를 돌려준다
function bindFolderColorPicker(initial) {
  let picked = initial;
  const clearSel = () => $$("#m_fcolors .fc-swatch, #m_fcustom_wrap").forEach(x => x.classList.remove("sel"));
  $$("#m_fcolors .fc-swatch").forEach(sw => {

    picked = $("m_fcustom").value;
    clearSel();
    const wrap = $("m_fcustom_wrap");
    wrap.classList.add("sel", "picked");
    wrap.style.setProperty("--picked", picked);
  });
  return () => picked;
}

function addLog() {
  const chat = getActive();
  if (!chat) return;
  const txt = $("logInput").value.trim();
  if (!txt) { toast("내용을 붙여넣어 주세요"); return; }
  if (composerMode === "turn") {
    chat.turns.push({ id: uid(), raw: txt, createdAt: now(), turnNo: extractTurnNo(txt) });
  } else {
    const chunks = splitBulk(txt);
    const seq = $("seqNumber") && $("seqNumber").checked;
    // 중복 판별 — 이미 있는 턴들의 내용을 정규화해 모아둔다 (공백 차이 무시)
    const normKey = s => (s || "").replace(/\s+/g, " ").trim();
    const existing = new Set(chat.turns.map(t => normKey(t.raw)));
    let added = 0, skipped = 0;
    let nextNo = chat.turns.length;
    chunks.forEach(ch => {
      if (!ch.trim()) return;
      const raw = ch.trim();
      // 이미 보관함에 있는 턴이면 건너뛴다
      if (existing.has(normKey(raw))) { skipped++; return; }
      existing.add(normKey(raw));
      const turn = { id: uid(), raw: raw, createdAt: now() };
      if (seq) {
        turn.turnNo = nextNo++;
        turn.turnNoManual = true; // 순서 번호 — 턴 내용 수정해도 유지
      } else {
        turn.turnNo = extractTurnNo(ch);
      }
      chat.turns.push(turn);
      added++;
    });
    if (skipped > 0)
      toast(added + "개 추가 · 중복 " + skipped + "개는 건너뛰었어요");
    else
      toast(added + "개의 턴으로 나눠 담았어요");
  }
  chat.updatedAt = now();
  $("logInput").value = "";
  save();
  // 입력순 정렬 + 검색 안 하는 중이면 — 전체를 다시 그리지 않고 새 턴만 덧붙인다 (대용량에서 빠름)
  if (sortMode === "input" && !logQuery && chat.turns.length > 1) {
    appendNewTurns(chat);
    renderSidebar();
  } else {
    renderAll();
  }
  setTimeout(() => { $("scrollArea").scrollTop = $("scrollArea").scrollHeight; }, 80);
  if (composerMode === "turn") toast("턴을 추가했어요");
}
// 화면에 아직 안 그려진 턴들만 골라 뒤에 덧붙인다
function appendNewTurns(chat) {
  const inner = $("scrollInner");
  const drawn = inner.querySelectorAll(".turn").length;
  const all = sortedTurns(chat);
  document.body.classList.add("has-turns");
  if ($("navFab")) $("navFab").style.display = "flex";
  // 새 턴을 10개씩 나눠 그린다 — 한꺼번에 그리면 큰 방에서 멈출 수 있음
  const STEP = 10;
  let cur = drawn;
  const drawChunk = () => {
    if (cur >= all.length || getActive() !== chat) return;
    const end = Math.min(cur + STEP, all.length);
    let frag = "";
    for (let i = cur; i < end; i++) frag += renderTurn(all[i], i);
    inner.insertAdjacentHTML("beforeend", frag);
    cur = end;
    bindTurnEvents(chat);
    if (cur < all.length) requestAnimationFrame(drawChunk);
  };
  requestAnimationFrame(drawChunk);
}

function splitBulk(text) {
  text = text.replace(/\r\n/g, "\n");
  if (/\n\s*[-\u2014=]{3,}\s*\n/.test(text))
    return safeSplit(text, /\n\s*[-\u2014=]{3,}\s*\n/);
  if (/\[\s*\d+\s*턴/.test(text))
    return safeSplit(text, /(?=\n[^\n]*\[\s*\d+\s*턴)/);
  return [text];
}
function safeSplit(text, re) {
  const guards = [];
  const protectedText = text.replace(/<details[\s\S]*?<\/details>/gi, m => {
    guards.push(m);
    return "\u0000D" + (guards.length - 1) + "\u0000";
  });
  return protectedText.split(re)
    .map(p => p.replace(/\u0000D(\d+)\u0000/g, (mm, i) => guards[+i]))
    .filter(p => p.trim());
}

/* ===== 채팅 테마 색 ===== */
// hex → {r,g,b}
function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  return {
    r: parseInt(hex.slice(0, 2), 16),
    g: parseInt(hex.slice(2, 4), 16),
    b: parseInt(hex.slice(4, 6), 16)
  };
}
function rgbaStr(hex, a) {
  const c = hexToRgb(hex);
  return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
}
// 색을 흰/검 쪽으로 섞기 (amount 0~1)
function mix(hex, target, amount) {
  const c = hexToRgb(hex);
  const t = target === "white" ? 255 : 0;
  const m = ch => Math.round(ch + (t - ch) * amount);
  return "rgb(" + m(c.r) + "," + m(c.g) + "," + m(c.b) + ")";
}
// 현재 채팅의 테마 색을 콘텐츠 영역에 CSS 변수로 주입
function applyChatTheme() {
  const chat = getActive();
  const root = document.body;
  const isDark = root.dataset.theme === "dark";
  const vars = ["--c-accent", "--c-accent-deep", "--c-soft", "--c-statbg", "--c-stathead", "--c-select"];
  if (!chat || !chat.themeColor) {
    vars.forEach(v => root.style.removeProperty(v));
    return;
  }
  const col = chat.themeColor;
  root.style.setProperty("--c-accent", col);
  root.style.setProperty("--c-accent-deep", isDark ? mix(col, "white", 0.25) : mix(col, "black", 0.18));
  root.style.setProperty("--c-soft", rgbaStr(col, isDark ? 0.18 : 0.12));
  root.style.setProperty("--c-statbg", rgbaStr(col, isDark ? 0.07 : 0.05));
  root.style.setProperty("--c-stathead", rgbaStr(col, isDark ? 0.16 : 0.11));
  root.style.setProperty("--c-select", isDark ? mix(col, "black", 0.45) : mix(col, "white", 0.68));
}

function importFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.chats)) throw new Error("형식 오류");
      confirmModal("불러오기 방식 선택",
        data.chats.length + "개의 채팅을 발견했어요.\n현재 채팅에 합칠지, 전부 교체할지 골라주세요.",
        () => {
          const existing = new Set(state.chats.map(c => c.id));
          data.chats.forEach(c => { if (!existing.has(c.id)) state.chats.push(c); });
          // 폴더도 함께 합친다
          if (Array.isArray(data.folders)) {
            const exF = new Set(state.folders.map(f => f.id));
            data.folders.forEach(f => { if (!exF.has(f.id)) state.folders.push(f); });
          }
          save(); renderAll();
          toast("채팅을 합쳤어요");
        },
        () => {
          state = data;
          if (!state.chats) state.chats = [];
          if (!state.folders) state.folders = [];
          activeId = state.chats.length ? state.chats[0].id : null;
          save(); renderAll();
          toast("데이터를 교체했어요");
        },
        "합치기", "교체하기");
    } catch (err) {
      toast("불러올 수 없는 파일이에요");
    }
  };
  reader.readAsText(file);
}

function copyText(text) {

    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));

function fallbackCopy(text) {

  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

let lastLogScrollTopForTitle = 0;
let lastTitleShownAt = 0;

// 검색창이 닫혀 있을 때: 아래로 스크롤하면 제목줄 숨김 / 위로 조금 올리면 다시 표시
function updateContentTitleAutoHide() {
  const content = document.querySelector(".content");
  const bar = $("logSearchBar");
  const area = $("scrollArea");
  if (!content || !area) return;

  const y = area.scrollTop || 0;
  const prev = lastLogScrollTopForTitle;
  const diff = y - prev;
  const searchOpen = bar && bar.style.display !== "none";

  // 검색창이 열려 있을 때는 기존 검색 고정 로직이 제목줄을 관리하게 둠
  if (searchOpen) {
    content.classList.remove("title-auto-hidden");
    lastLogScrollTopForTitle = y;
    return;
  }

  // 맨 위 근처에서는 무조건 보이기
  if (y < 40) {
    content.classList.remove("title-auto-hidden");
    lastTitleShownAt = y;
    lastLogScrollTopForTitle = y;
    return;
  }

  // 아래로 충분히 내리면 숨김
  if (diff > 8 && y > 80) {
    content.classList.add("title-auto-hidden");
  }

  // 위로 조금이라도 올리면 다시 표시
  if (diff < -6) {
    content.classList.remove("title-auto-hidden");
    lastTitleShownAt = y;
  }

  lastLogScrollTopForTitle = y;
}

function exCompress(html, uid) {
  const map = new Map();
  const unesc = t => t.replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
  const out = html.replace(/<([a-z][\w-]*)((?:\s+[\w:-]+(?:="[^"]*")?)*)(\s*\/?)>/gi, (m, tag, attrs, end) => {

    let k = map.get(sm[1]);
    if (!k) { k = uid + "c" + map.size.toString(36); map.set(sm[1], k); }

    const cm = a.match(/\sclass="([^"]*)"/);
    a = cm ? a.replace(cm[0], ' class="' + cm[1] + " " + k + '"') : a + ' class="' + k + '"';
    return "<" + tag + a + end + ">";
  });
  let css = "";
  map.forEach((k, st) => { css += "." + uid + " ." + k + "{" + unesc(st) + "}"; });
  return { html: out, css };
}

async function snapJsxRaw(src, chat, quick) {

        const r2 = await askJsxSnap(ifr, 40000, "lk-jsx-explore");

function exInline(line, isUser, chat) {

      const c = line.indexOf("*", i + 1);
      if (c !== -1) { out += '<span style="color:' + nar + '">' + escapeHtml(line.slice(i + 1, c)) + "</span>"; i = c + 1; continue; }
      out += "*"; i++; continue;

    let nx = line.indexOf("*", i);

function exStatus(data) {

    it.type === "kv" ? '<div><b style="color:#5a5f6e">' + escapeHtml(it.key) + "</b> " + escapeHtml(it.val) + "</div>" :
    it.type === "section" ? '<div style="margin-top:8px;font-weight:700;color:#b67d1f">' + escapeHtml(it.text) + "</div>" :
    it.type === "li" ? "<div>· " + escapeHtml(it.text) + "</div>" :
    "<div>" + escapeHtml(it.text || "") + "</div>").join("");
  return '<details style="margin:14px 0;border:1px solid #e1e7f3;border-radius:12px;background:#f4f7fd;padding:10px 14px;font-size:14px">' +
    '<summary style="cursor:pointer;font-weight:600">🪪 ' + escapeHtml(data.summary) + "</summary>" +
    '<div style="margin-top:8px;line-height:1.7">' + body + "</div></details>";
}
async function buildTistoryHtml(chat, from, to, withNo, onProg, inline, live, fmt) {
  fmt = fmt || {};
  const all = sortedTurns(chat);
  const turns = all.slice(from - 1, to);
  const parts = [], jobs = [];
  for (let ti = 0; ti < turns.length; ti++) {
    const turn = turns[ti];
    let h = "";
    let blocks;
    try { blocks = parseLog(turn.raw); } catch (e) { blocks = [{ kind: "prose", text: turn.raw || "" }]; }
    for (const b of blocks) {
      try {
        if (b.kind === "prose") h += exProse(b.text, false, chat);
        else if (b.kind === "user") h += '<div style="margin:0 0 20px">' + exProse(b.text, true, chat) + "</div>";
        else if (b.kind === "code") h += '<pre style="white-space:pre-wrap;background:#f4f5f8;border-radius:8px;padding:10px 12px">' + escapeHtml(b.text.trim()) + "</pre>";
        else if (b.kind === "status") h += exStatus(b.data);
        else if (b.kind === "htmlstatus") h += '<div style="margin:14px 0">' + sanitizeHtml(b.html) + "</div>";
        else if (b.kind === "jsx") {
          h += "@@LKJOB" + jobs.length + "@@";
          jobs.push(b.src);
        }
      } catch (e) { console.warn("export block failed", e); }
    }
    const no = effectiveTurnNo(chat, turn);
    const label = withNo ? '<p style="color:#2f6df0"><b>TURN ' + (no != null ? no : (chat.turns.indexOf(turn) + 1)) + "</b></p>" : "";
    parts.push("<div>" + label + h + "</div>");
  }
  // 상태창은 6개씩 동시에 그린다
  const res = new Array(jobs.length), liveDefs = {};
  let next = 0, done = 0;
  onProg && onProg(0, jobs.length);
  await Promise.all(Array.from({ length: Math.min(6, jobs.length) }, async () => {
    while (next < jobs.length) {
      const i = next++;
      let html = null;
      try { html = live ? await liveJsxForExport(jobs[i], chat, inline, liveDefs) : await snapJsxForExport(jobs[i], chat, inline); } catch (e) { console.warn("export jsx failed", e); }
      // 상태창 안의 absolute 장식이 아래 상태창을 덮지 않도록 블록마다 가둔다
      res[i] = html ? '<div style="margin:16px 0;position:relative;isolation:isolate;overflow:clip;overflow-clip-margin:16px;text-align:start;word-break:normal">' + html + "</div>"
                    : '<div style="margin:16px 0;padding:10px;border:1px dashed #ccc;border-radius:8px;font-size:12px;color:#999">(상태창을 그리지 못했어요)</div>';
      onProg && onProg(++done, jobs.length);
    }
  }));
  for (let i = 0; i < parts.length; i++) parts[i] = parts[i].replace(/@@LKJOB(\d+)@@/g, (m, n) => res[+n] || "");
  // 본문 글씨는 색만 넣고 글꼴·크기·줄간격은 비워 둔다 (티스토리 글씨 크기 설정이 그대로 먹게)
  const head = "<p><b>" + escapeHtml((chat.emoji ? chat.emoji + " " : "") + (chat.title || "")) + "</b></p>" +
    Object.keys(liveDefs).map(n => '<div data-lk-def="' + escapeHtml(n) + '" style="display:none">' + b64u(liveDefs[n]) + "</div>").join("");
  // box-shadow:none 은 일부 스킨(ONE LOGIN 등)이 [[HTML]] 안의 <details> 를 자체 상태창으로 바꿔 버리는 걸 막는 표시
  // 글꼴·크기는 스킨 읽기 도구 값(--reader-size / --reader-font / --font)을 따르고, 없으면 바깥 글씨를 그대로 물려받는다
  // 본문 정렬: 양쪽 맞춤 / 글자 단위로 자르기(break-all) 또는 단어 단위(keep-all)
  return '<div style="max-width:720px;margin:0 auto;' + (fmt.justify ? "text-align:justify;" : "") +
    "word-break:" + (fmt.breakAll ? "break-all" : "keep-all") + ';overflow-wrap:anywhere;box-shadow:none;' +
    'font-size:var(--reader-size,1em);font-family:var(--reader-font,var(--font));color:var(--tx)">' +
    head + parts.join('<hr style="border:0;border-top:1px dashed #dde1ea;margin:30px 0">') + "</div>";
}
function lsGetSafe(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSetSafe(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    '<li><span>맨 아래 <code>&lt;/s_t3&gt;</code> <b>바로 위</b>에 붙여넣기 <span style="color:var(--text-dim)">(밖에 두면 티스토리가 지워요)</span></span></li>' +
    '<li><span>적용하면 끝! 이미 올린 글에도 바로 먹어요</span></li></ol></div></div>' +
    '<div class="ex-sec"><div class="ex-label">범위<span class="ex-sub">전체 ' + n + '턴 · 지금 정렬 순서 기준</span></div>' +

    opt("exJustify", ck("lk_exJustify"), "양쪽 맞춤") +
    opt("exBreakAll", ck("lk_exBreakAll"), "글자 단위로 자르기", "끄면 단어 단위로 줄바꿈") +
    opt("exWrap", ck("lk_exWrap"), "[[HTML]] 로 감싸기", "스킨 기본 칸에 붙여넣을 때 · 끄면 티스토리 HTML 모드용") +
    '</div></div>' +
    '<div class="ex-prog" id="exProgWrap" hidden><div class="ex-bar"><i id="exBar"></i></div><p id="exProg"></p></div>',

  }));
  const setProg = (txt, ratio, state) => {

    w.hidden = false;
    w.classList.toggle("done", state === "done");
    w.classList.toggle("err", state === "err");
    if (ratio != null) $("exBar").style.width = Math.round(ratio * 100) + "%";
    $("exProg").textContent = txt;
  };
  let busy = false;
  const run = async mode => {
    if (busy) return;
    busy = true;
    const from = Math.max(1, Math.min(n, parseInt($("exFrom").value) || 1));
    const to = Math.max(from, Math.min(n, parseInt($("exTo").value) || n));

    try {
      // HTML 모드에 바로 붙일 때는 페이지 CSS 에 지지 않게 style 을 그대로 둔다
      const inline = mode === "copy" && !$("exWrap").checked;

      lsSetSafe("lk_exJustify", fmt.justify ? "1" : "0");
      lsSetSafe("lk_exBreakAll", fmt.breakAll ? "1" : "0");

        copyText(wrap ? "[[HTML]]" + html.replace(/<style>[\s\S]*?<\/style>/g, m => m.replace(/\r?\n/g, " ")).replace(/\r?\n/g, "&#10;") + "[[/HTML]]" : html);
        setProg("복사했어요! (" + kb + "KB) " + (wrap ? "글쓰기 기본 칸에 그대로 붙여넣으세요." : "티스토리 HTML 모드에 붙여넣으세요."), 1, "done");

  const v = $("logSearchInput").value.trim();
  if (v === logQuery && v !== "") {
    // 같은 검색어로 또 엔터 — 다음 일치로 이동
    moveLogHit(1);
    return;
  }
  logQuery = v;
  logHitIdx = 0;
  renderMain();
}

  if (e.key === "Enter") {
    e.preventDefault();
    if (e.shiftKey && logQuery) moveLogHit(-1); // Shift+Enter — 이전
    else runLogSearch();
  } else if (e.key === "Escape") {
    e.preventDefault();
    closeLogSearch();
  }
});

let _logToolSite = "cd";
function openCaveduckModal(site) {
  if (typeof site === "string" && LOG_TOOLS[site]) _logToolSite = site;
  const tool = LOG_TOOLS[_logToolSite];
  const code = tool.code();
  const a = document.createElement("a");
  a.href = code;
  a.textContent = tool.label;
  a.className = "bm-drag" + (tool.cls ? " " + tool.cls : "");
  a.draggable = true;
  a.addEventListener("click", e => e.preventDefault());
  const tabs = Object.keys(LOG_TOOLS).map(k =>
    '<button data-site="' + k + '"' + (k === _logToolSite ? ' class="on"' : '') + '>' + LOG_TOOLS[k].label.replace(" 로그 추출", "") + '</button>'
  ).join("");
  openModal(tool.name + " 로그 추출 도구", '' +
    '<div class="bm-site">' + tabs + '</div>' +
    '<p class="desc">' + tool.name + ' 채팅 페이지에서 로그를 한 번에 추출하는 도구예요. ' +
    '브라우저 보안 때문에 버튼만으로 즐겨찾기에 자동 등록은 불가능해서, 아래 두 가지 방법 중 하나로 한 번만 등록해 두면 돼요.</p>' +
    '<div class="bm-block">' +
      '<div class="bm-step">방법 1 · 드래그해서 등록 (가장 쉬움)</div>' +
      '<p class="bm-hint">아래 버튼을 브라우저 <b>북마크 바</b>로 끌어다 놓으세요. 그러면 즐겨찾기에 등록돼요.</p>' +
      '<div class="bm-drag-wrap" id="bmDragWrap"></div>' +
    '</div>' +
    '<div class="bm-block">' +
      '<div class="bm-step">방법 2 · 코드 복사해서 등록</div>' +
      '<p class="bm-hint">아무 페이지나 즐겨찾기에 추가한 뒤, 그 즐겨찾기를 <b>수정</b>해서 URL 칸에 복사한 코드를 붙여넣으세요.</p>' +
      '<textarea class="bm-code" id="bmCode" readonly rows="4"></textarea>' +
    '</div>' +
    '<div class="bm-block">' +
      '<div class="bm-step">사용법</div>' +
      '<p class="bm-hint">' + tool.usage + '</p>' +
    '</div>',
    [{ label: "코드 복사", id: "bmCopyBtn", primary: true }, { label: "닫기", close: true }]
  );
  $$(".bm-site button").forEach(b => b.addEventListener("click", () => openCaveduckModal(b.dataset.site)));
  $("bmDragWrap").appendChild(a);
  $("bmCode").value = code;
  $("bmCopyBtn").addEventListener("click", () => {
    const ta = $("bmCode");
    ta.select();
    copyText(code);
    toast(tool.name + " 추출 코드를 복사했어요");
  });
}
$("caveduckBtn").addEventListener("click", () => openCaveduckModal());

// ===== 형광펜 =====
// 로그 본문에서 텍스트를 드래그하면 색 팔레트가 떠서, 색을 고르면 칠해진다.
let _hlPalette = null;
function closeHlPalette() {
  if (_hlPalette) { _hlPalette.remove(); _hlPalette = null; }
}
$("scrollArea").addEventListener("mouseup", e => {
  // 팔레트 자체를 클릭한 경우는 무시
  if (e.target.closest && e.target.closest(".hl-palette")) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) { closeHlPalette(); return; }
    const text = sel.toString();
    if (!text.trim() || text.trim().length < 1) { closeHlPalette(); return; }
    // 선택 영역이 한 턴의 turn-body 안에 있는지 확인
    const range = sel.getRangeAt(0);
    const startEl = range.startContainer.parentElement || range.startContainer;
    const turnEl = startEl.closest && startEl.closest(".turn");
    if (!turnEl) { closeHlPalette(); return; }
    const body = turnEl.querySelector(".turn-body");
    if (!body || !body.contains(range.startContainer)) { closeHlPalette(); return; }
    // 클릭한 위치 근처에 팔레트 표시
    showHlPalette(e.pageX, e.pageY, turnEl.dataset.tid, text);
  }, 10);
});
// 다른 곳을 클릭하면 팔레트 닫기
document.addEventListener("mousedown", e => {
  if (_hlPalette && !(e.target.closest && e.target.closest(".hl-palette")))
    closeHlPalette();
});
function showHlPalette(x, y, tid, selText) {
  closeHlPalette();
  const colors = [
    ["yellow", "#fff3a8"], ["green", "#b6f0c4"],
    ["pink", "#ffc4dd"], ["blue", "#bcdcff"]
  ];
  const pal = document.createElement("div");
  pal.className = "hl-palette";
  for (const [name, hex] of colors) {
    const sw = document.createElement("button");
    sw.className = "hl-swatch";
    sw.style.background = hex;
    sw.title = "이 색으로 칠하기";
    sw.addEventListener("click", () => { addHighlight(tid, selText, name); closeHlPalette(); });
    pal.appendChild(sw);
  }
  // 지우개 — 이 선택 영역에 걸친 형광펜을 지운다
  const er = document.createElement("button");
  er.className = "hl-swatch erase";
  er.textContent = "\u232B";
  er.title = "형광펜 지우기";
  er.addEventListener("click", () => { removeHighlight(tid, selText); closeHlPalette(); });
  pal.appendChild(er);
  const ex = document.createElement("button");
  ex.className = "hl-excerpt";
  ex.textContent = "✂ 발췌";
  ex.title = "발췌 이미지 메이커로 보내기";
  ex.addEventListener("click", () => {
    const text = selText.trim();
    if (!text) return;
    const chat = getActive();
    const charName = (chat && chat.title) || '';
    try { localStorage.setItem("qc:incoming", JSON.stringify({ text, charName, ts: Date.now() })); } catch(e) {}
    window.open("https://s62rry.github.io/chat/card_maker.html", "qc_maker");
    closeHlPalette();
    window.getSelection().removeAllRanges();

function addHighlight(tid, text, color) {

function removeHighlight(tid, text) {
  const chat = getActive();
  if (!chat) return;
  const turn = chat.turns.find(t => t.id === tid);
  if (!turn || !turn.highlights) return;
  const clean = text.trim();
  // 선택 영역과 겹치는 형광펜을 제거 (서로 포함 관계면 겹친 것으로 본다)
  const before = turn.highlights.length;
  turn.highlights = turn.highlights.filter(h =>
    !(h.text.includes(clean) || clean.includes(h.text))
  );
  if (turn.highlights.length === before) { toast("지울 형광펜이 없어요"); return; }
  chat.updatedAt = now();
  save();

}

function repaintTurnHighlights(tid) {
  const turnEl = $$(".turn").find(el => el.dataset.tid === tid);

      let folders = [], order = [];
      if (meta.exists()) { const d = meta.data(); try { folders = JSON.parse(d.folders || '[]'); } catch (e) {} order = Array.isArray(d.order) ? d.order : []; }
      const snap = await getDocs(collection(db, 'users', user.uid, C_CHATS));
      const manifests = {}, chunkMap = {};
      snap.forEach(dd => {
        const id = dd.id, data = dd.data(), us = id.lastIndexOf('__');
        if (us >= 0 && /^\d+$/.test(id.slice(us + 2))) { const base = id.slice(0, us); (chunkMap[base] = chunkMap[base] || {})[+id.slice(us + 2)] = data.d || ''; }
        else manifests[id] = data;
      });
      const map = {}, lenMap = {};
      for (const id of Object.keys(manifests)) {
        const man = manifests[id]; let raw;
        if ((man.n || 1) <= 1) raw = man.j != null ? man.j : '';
        else { const cm = chunkMap[id] || {}, parts = []; for (let i = 0; i < man.n; i++) parts.push(cm[i] || ''); raw = parts.join(''); }
        try { const c = JSON.parse(raw || 'null'); if (c && c.id) { map[c.id] = c; lenMap[c.id] = { len: raw.length, n: man.n || 1 }; } } catch (e) {}
      }
      let chats = order.filter(id => map[id]).map(id => map[id]);
      Object.keys(map).forEach(id => { if (!order.includes(id)) chats.push(map[id]); });
      await idbSetState({ chats, folders });
      setSynced(lenMap);
      if (meta.exists()) setLastSig(meta.data().sig);
    } finally { pulling = false; }
    location.reload();
  }

  const schedulePush = () => { clearTimeout(pushTimer); pushTimer = setTimeout(pushAll, 1500); };
  function startPoll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      if (!user || pulling || pushing) return;
      const sig = hash(canon(await readState()));
      if (sig !== getLastSig()) schedulePush();   // 클라우드 반영분과 다르면 올림(성공 시 lastSig 갱신→멈춤, 실패 시 다음 폴에서 재시도)
    }, 4000);
  }
  function stopPoll() { clearInterval(pollTimer); pollTimer = null; }
  window.addEventListener('pagehide', () => { if (user && pushTimer) { clearTimeout(pushTimer); pushAll(); } });

  async function firstSync() {
    let meta; try { meta = await getDoc(metaDoc()); } catch (e) { return; }
    const st = await readStateStable();
    const localEmpty = !(st.chats && st.chats.length);
    // 구버전이 큰 로그(1MB+)를 빠뜨렸던 흔적 복구: 클라우드에 없는 로컬 로그가 있으면 전체 강제 업로드
    if (getSyncVer() < SYNC_VER) {
      setSyncVer(SYNC_VER);
      if (meta.exists() && !localEmpty) {
        try {
          const snap = await getDocs(collection(db, 'users', user.uid, C_CHATS));
          const cloudIds = new Set();
          snap.forEach(d => { const id = d.id, us = id.lastIndexOf('__'); cloudIds.add(us >= 0 && /^\d+$/.test(id.slice(us + 2)) ? id.slice(0, us) : id); });
          if ((st.chats || []).some(c => !cloudIds.has(c.id))) {
            setSynced({}); toast('빠진 로그를 올리는 중…'); await pushAll(true); toast('동기화 복구 완료'); startPoll(); return;
          }
        } catch (e) { console.warn('[sync] 복구 점검 실패', e); }
      }
    }
    const localSig = hash(canon(st));
    const cloudSig = meta.exists() ? meta.data().sig : null;
    const lastSig = getLastSig();
    if (!meta.exists()) { if (!localEmpty) { toast('클라우드에 백업 중…'); await pushAll(); toast('클라우드 동기화 켜짐'); } setLastSig(localSig); lastCanon = canon(st); startPoll(); return; }
    if (cloudSig === localSig) { setLastSig(cloudSig); lastCanon = canon(st); startPoll(); return; }       // 이미 같음
    if (localEmpty || localSig === lastSig) { toast('클라우드 로그 불러오는 중…'); await pull(); return; } // 이 기기는 그대로·비었음 → 클라우드 가져오기
    if (cloudSig === lastSig) { toast('클라우드에 백업 중…'); await pushAll(); startPoll(); return; }        // 클라우드는 그대로, 이 기기만 바뀜 → 올리기
    // 마지막 동기화 이후 양쪽 다 바뀜 → 진짜 충돌일 때만 물어봄
    card.innerHTML =
      '<h3>로그가 양쪽에서 바뀌었어요</h3>' +
      '<p>이 기기와 클라우드 양쪽이 마지막 동기화 이후 각각 바뀌었어요. 어느 쪽으로 맞출까요? <b>(고른 쪽이 남고 다른 쪽은 덮어써져요.)</b></p>' +
      '<div class="row"><button id="syPull" class="primary">클라우드 불러오기 <small>(이 기기 덮어씀)</small></button></div>' +
      '<div class="row"><button id="syPush">이 기기 올리기 <small>(클라우드 덮어씀)</small></button></div>';
    mask.classList.add('show');
    card.querySelector('#syPull').onclick = async () => { closeModal(); toast('불러오는 중…'); await pull(); };
    card.querySelector('#syPush').onclick = async () => { closeModal(); toast('올리는 중…'); await pushAll(); toast('클라우드에 올렸어요'); startPoll(); };
  }

  btn.onclick = () => { if (user) openAccount(user.email); else openLogin(); };

  onAuthStateChanged(auth, async u => {
    user = u;
    if (u) { btn.classList.add('on'); setLabel(u.email ? u.email.split('@')[0] : '동기화 켜짐'); await firstSync(); }
    else { btn.classList.remove('on'); setLabel('로그인'); stopPoll(); lastCanon = null; }
  });
})();
</script>
<script>
/* ===== 케이브덕 런처 → 로그 보관함 자동 등록 (postMessage 수신) =====
   런처의 '로그 추출' 결과창에서 [보관함으로] 를 누르면
   이 페이지가 ?lkimport=1 로 열리고, 로그를 postMessage 로 받아 새 채팅방에 담는다. */
(function () {
  if (new URLSearchParams(location.search).get("lkimport") !== "1") return;
  var ALLOW = ["https://caveduck.io", "https://www.caveduck.io"];
  // 티팟 (teapotchat.com / fairytale.ai.kr 및 그 하위 도메인)
  var ALLOW_RE = /^https:\/\/([a-z0-9-]+\.)*(teapotchat\.com|fairytale\.ai\.kr|wrtn\.ai)$/i;
  function allowed(o) { return ALLOW.indexOf(o) >= 0 || ALLOW_RE.test(o); }
  var handled = {};

  // load() 가 비동기라 state 가 준비될 때까지 기다린다
  function ready() {
    return new Promise(function (res) {
      var n = 0;
      var t = setInterval(function () {
        if (typeof state !== "undefined" && state && state.chats) { clearInterval(t); res(true); }
        else if (++n > 240) { clearInterval(t); res(false); }
      }, 50);
    });
  }

  function doImport(p) {
    var text = String(p.text || "").replace(/\r\n/g, "\n").trim();
    if (!text) return 0;
    var pid = String(p.id || "");
    var fromTp = pid.indexOf("tp") === 0, fromCr = pid.indexOf("cr") === 0;
    var site = fromCr ? "크랙" : fromTp ? "티팟" : "케이브덕";
    var title = String(p.title || "").trim() || (site + " 로그");
    var emoji = String(p.emoji || "").trim() || (fromCr ? "🍪" : fromTp ? "🫖" : "🦆");
    var chat = { id: uid(), title: title, emoji: emoji, createdAt: now(), updatedAt: now(), turns: [] };
    state.chats.push(chat);
    activeId = chat.id;
    var added = 0;
    if (p.mode === "bulk") {
      splitBulk(text).forEach(function (ch) {
        var raw = String(ch || "").trim();
        if (!raw) return;
        var turn = { id: uid(), raw: raw, createdAt: now(), turnNo: added, turnNoManual: true };
        chat.turns.push(turn);
        added++;
      });
    }
    if (!added) {
      chat.turns.push({ id: uid(), raw: text, createdAt: now(), turnNo: extractTurnNo(text) });
      added = 1;
    }
    chat.updatedAt = now();
    save();
    renderAll();
    try { if (_saveTimer) { clearTimeout(_saveTimer); doSave(); } } catch (e) {}
    setTimeout(function () { var sa = $("scrollArea"); if (sa) sa.scrollTop = 0; }, 120);
    toast(site + "에서 " + added + "개 턴을 받아 \u201c" + title + "\u201d 방에 담았어요");
    return added;
  }

  function reply(src, origin, id, count) {
    try { src.postMessage({ type: "lk-imported", id: id, count: count }, origin); } catch (e) {}
  }

  window.addEventListener("message", function (ev) {
    if (!allowed(ev.origin)) return;
    var d = ev.data;
    if (!d || typeof d !== "object" || d.type !== "lk-import") return;
    // 같은 요청이 여러 번 와도 한 번만 담는다
    if (handled[d.id] != null) { reply(ev.source, ev.origin, d.id, handled[d.id]); return; }
    handled[d.id] = 0;
    ready().then(function (ok) {
      if (!ok) { delete handled[d.id]; alert("보관함이 아직 준비되지 않았어요. 새로고침한 뒤 다시 보내주세요."); return; }
      var n = 0;
      try { n = doImport(d) || 0; } catch (e) { console.warn("lk import failed", e); }
      handled[d.id] = n;
      reply(ev.source, ev.origin, d.id, n);
    });
  });

  // 준비됐다고 런처에 알린다 (런처가 놓쳐도 런처 쪽에서 재시도함)
  function hello() {
    if (!window.opener) return;
    ALLOW.concat(["https://teapotchat.com", "https://www.teapotchat.com", "https://fairytale.ai.kr", "https://www.fairytale.ai.kr", "https://crack.wrtn.ai", "https://wrtn.ai", "https://www.wrtn.ai"])
      .forEach(function (o) { try { window.opener.postMessage({ type: "lk-ready" }, o); } catch (e) {} });
  }
  ready().then(hello);
  var hi = 0;
  var hiT = setInterval(function () {
    hello();
    if (++hi > 12 || Object.keys(handled).length) clearInterval(hiT);
  }, 500);
})();
</script>
